<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>1P 리플릿 (프로모션)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>
:root{--ink:#111;--ink2:#444;--line:#e3e3e3;--soft:#f5f7fa;--blue:#0072CE}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;word-break:keep-all}
body{display:flex;flex-direction:column}
.bar{flex:none;background:#fff;border-bottom:1px solid var(--line)}
.in{max-width:1200px;margin:0 auto;padding:16px 24px 0}
.kicker{font-size:13px;color:var(--blue);font-weight:700}
.kicker a{color:inherit;text-decoration:none}
h1{font-size:22px;margin:2px 0 12px;font-weight:800}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs a{padding:9px 16px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--soft);color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px}
.tabs a.on{background:var(--blue);border-color:var(--blue);color:#fff}
iframe{flex:1;display:block;width:100%;border:0;min-height:0}
</style></head><body>

<iframe id="v" title="1P 리플릿 (프로모션)"></iframe>
<script>
const tabs=[...document.querySelectorAll('.tabs a')], fr=document.getElementById('v');
function show(){let i=parseInt(location.hash.slice(1))||1; if(i<1||i>tabs.length)i=1; tabs.forEach((t,k)=>t.classList.toggle('on',k===i-1)); const s=tabs[i-1].dataset.src; if(fr.getAttribute('src')!==s) fr.setAttribute('src',s);}
window.addEventListener('hashchange',show); show();
</script>
