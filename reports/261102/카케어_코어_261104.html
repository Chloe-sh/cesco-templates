<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>세스코 카케어 코어 · 클로드 / GPT 버전 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#111;--ink2:#444;--ink3:#777;--line:#e3e3e3;--soft:#f5f7fa;--blue:#0072CE;--blue-soft:#e6f1fb;--navy:#0A3568}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;word-break:keep-all}
body{display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:2px solid var(--ink);background:#fff}
.bar .kicker{font-size:12.5px;color:var(--blue);font-weight:700;white-space:nowrap}
.bar .title{font-size:15px;font-weight:800;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto;background:var(--soft)}
.seg button{border:0;background:transparent;padding:7px 18px;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button .d{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-top:1px}
.seg button.on{background:var(--navy);color:#fff}
.seg button.on .d{color:#cfe0f7}
.open{font-size:12.5px;color:var(--ink3);text-decoration:none;white-space:nowrap}
.open:hover{color:var(--blue)}
.frames{flex:1;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.frames iframe[hidden]{display:none}
@media (max-width:720px){.bar{flex-wrap:wrap;gap:6px 12px;padding:10px 14px}.bar .title{font-size:14px;flex:1 1 100%}.seg{margin-left:0;width:100%;display:flex}.seg button{flex:1;padding:8px 10px;font-size:13px}.seg button .d{display:none}.open{display:none}}
@media print{.bar{display:none}.frames iframe{position:static;height:100vh}}
</style></head>
<body>
<div class="bar">
  <span class="kicker">세스코 콘텐츠 템플릿 · 카케어</span>
  <span class="title">카케어 코어 · 키카피 &amp; 헤드카피</span>
  <div class="seg" role="tablist" aria-label="버전 선택">
    <button type="button" role="tab" data-v="claude">클로드 버전<span class="d">차별성 + 왜 세스코 30 + 전략 8장 + 메인 30 + 상품별 150</span></button>
    <button type="button" role="tab" data-v="gpt">GPT 버전<span class="d">차별성 + 브랜드 키카피 30 + 메인 10 + 상품별 50</span></button>
  </div>
  <a class="open" id="openNew" href="카케어_코어_261104_claude.html" target="_blank">새 탭에서 열기 ↗</a>
</div>
<div class="frames">
  <iframe id="f-claude" title="클로드 버전" src="about:blank"></iframe>
  <iframe id="f-gpt" title="GPT 버전" src="about:blank" hidden></iframe>
</div>
<script>
(function(){
  var files={claude:'카케어_코어_261104_claude.html',gpt:'카케어_코어_261104_gpt.html'};
  var loaded={};
  var btns=[].slice.call(document.querySelectorAll('.seg button'));
  var open=document.getElementById('openNew');
  function hashOf(v){var h=location.hash.replace(/^#/,'');if(!h)return'';var m=h.match(/^(claude|gpt)(?::(.*))?$/);if(m)return m[1]===v&&m[2]?'#'+m[2]:'';return'#'+h;}
  function show(v,push){
    if(!files[v])v='claude';
    var hash=push?'':hashOf(v);
    var f=document.getElementById('f-'+v);
    if(!loaded[v]){f.src=files[v]+hash;loaded[v]=true}
    else if(hash){try{f.contentWindow.location.hash=hash}catch(e){}}
    Object.keys(files).forEach(function(k){document.getElementById('f-'+k).hidden=(k!==v)});
    btns.forEach(function(b){var on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
    open.href=files[v]+hash;
    document.title='세스코 카케어 코어 · '+(v==='gpt'?'GPT 버전':'클로드 버전');
    try{localStorage.setItem('carcare-core-ver',v)}catch(e){}
    if(push){var q=new URLSearchParams(location.search);q.set('v',v);history.replaceState(null,'',location.pathname+'?'+q.toString())}
  }
  btns.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v,true)})});
  var q=new URLSearchParams(location.search).get('v');
  var h=(location.hash.match(/^#(claude|gpt)(?::|$)/)||[])[1];
  var saved=null;try{saved=localStorage.getItem('carcare-core-ver')}catch(e){}
  show(q||h||(location.hash?'claude':saved)||'claude',false);
})();
</script>
</body></html>
