킨집","측정 블록","제목"],"base":"오늘 튀기는 기름, 산가까지 확인했어요","dh":"기름부터 조리도구까지, 주방 위생을 확인했어요","parent":null,"why":"","note":""},{"id":"e10","kind":"text","path":["D","chicken","hc","ds"],"label":["치킨집","측정 블록","설명"],"base":"생닭은 교차 오염이 생기기 쉽고, 오래 쓴 기름은 산패하기 쉬워요. 그래서 튀김유 산가, 생닭 보관 온도, 칼·도마 소독, 작업자 손 위생, 후드·배기 기름때를 집중해서 봐요.","dh":"튀김유 산가와 생닭 보관 온도, 칼·도마의 오염도를 확인했어요. 기름때가 쌓이기 쉬운 주방 환경도 함께 살펴봐요.","parent":null,"why":"","note":""},{"id":"e11","kind":"text","path":["D","chicken","hc","sum"],"label":["치킨집","측정 블록","요약"],"base":"<b>5개 항목 모두 기준 안<\/b>. 세스코 전문가가 10.16에 측정기(산가계·ATP·부유균)로 직접 쟀어요","dh":"<b>표시된 4개 측정값은 화면 구성용 예시입니다.<\/b> 실제 측정 결과와 판정 기준은 원천자료 확인 후 공개해야 합니다.","parent":null,"why":"","note":"다해본은 \"예시입니다\" 안내문이에요. 필요하면 페이지 맨 위에 따로 두는 게 나아요."},{"id":"e12","kind":"list","path":["D","chicken","items"],"label":["치킨집","POINT 항목"],"base":[{"label":"튀김 기름 교체 주기","title":"늘 깨끗한 기름만 사용하기 위해<br>주기적으로 검사해요","copy":"기름이 오래되면 쩐내도 나고 색도 탁해져요. 발연점도 낮아져서 같은 온도로 튀겨도 탄내가 나죠. 위생과 건강에도 안 좋고요. 그래서 세스코 정기점검을 신청했어요. 산가 측정 도구로 정확하게 재니, 늘 새 기름 수준으로 유지할 수 있어요.","chip":"세스코 실측 · 튀김유 산가","cesco":1,"q":"기름은 언제 갈아요?","metric":0},{"label":"생닭 보관 온도","title":"생닭은 입고 즉시 냉장 보관하고<br>상온 노출을 최소화해<br>신선도를 유지해요.","copy":"입고된 닭은 바로 냉장고에 넣어서 0~5℃로 보관해요. 손질할 때도 상온에 두는 시간을 최대한 줄여요. 차갑게 둔 닭이라야 살이 탱글하고 튀겼을 때 촉촉하거든요. 세스코가 주기적으로 방문해서, 생닭 보관 환경과 상온 노출 환경을 꼼꼼하게 체크하고 있어요.","chip":"세스코 실측 · 생닭 냉장 온도","cesco":1,"q":"닭은 어떻게 보관해요?","metric":1},{"label":"염지·숙성 시간","title":"맛을 일정하게 유지하기 위해<br>염지 시간도 꼼꼼하게 지켜요.","copy":"치킨 맛을 좌우하는 건 양념뿐만이 아니에요. 염지 시간과 보관 온도에 따라서도 맛이 달라질 수 있거든요. 그래서 정해진 시간에 맞춰 염지하고, 조리 전까지 냉장 상태를 유지해요.","chip":"세스코 실측 · 냉장 보관 온도","cesco":1,"q":"염지는 어떻게 해요?","metric":1},{"label":"도마·칼 색 구분","title":"교차 오염은 위생의 천적!<br>생닭을 손질하는 칼과 도마는 따로 사용해요.","copy":"생닭에 있던 세균이 칼이나 도마로 다른 음식에 옮겨가지 않도록, 생닭용은 따로 사용해요. 그리고 쓰기 전후로 청결하게 세척·소독도 하죠. 세스코가 ATP 측정기로 칼과 도마가 깨끗한지 주기적으로 확인하니, 더욱 믿을 수 있어요.","chip":"세스코 실측 · 칼·도마 ATP","cesco":1,"q":"생닭 손질할 때 도마는요?","metric":2},{"label":"두 번 튀김·조리 온도","title":"겉은 바삭하고 속은 촉촉하도록,<br>온도를 확인하며 두 번 튀겨요.","copy":"같은 닭이라도 튀기는 온도와 시간에 따라 식감이 달라져요. 이곳은 조리 온도를 확인하고 두 번에 나눠 튀겨요. 조금 더 손이 가더라도 바삭한 식감을 유지하기 위한 조리 방식이에요.","chip":"매장 운영 정보","cesco":0,"q":"두 번 튀기는 이유가 있어요?","metric":-1},{"label":"후드·덕트 청소 주기","title":"눈에 잘 띄지 않는 주방 후드 안쪽까지<br>정기적으로 청소해요.","copy":"치킨을 튀길 때 발생하는 기름과 연기는 후드와 배기 덕트 안쪽에도 쌓일 수 있어요. 오래 방치하면 청소하기도 어려워지고 주방 환경에도 영향을 줄 수 있죠. 그래서 보이지 않는 안쪽까지 정기적으로 청소하고 관리해요.","chip":"세스코 실측 · 주방 공기","cesco":1,"q":"후드 청소는 누가, 얼마나 자주 해요?","metric":3},{"label":"포장 방식","title":"포장 후에도 바삭한 치킨을<br>즐길 수 있도록 신경 써요.","copy":"갓 튀긴 치킨을 바로 밀폐하면 뜨거운 김 때문에 눅눅해지기 쉬워요. 그래서 포장 상자에는 김이 빠지는 구멍을 내고, 뚜껑도 바로 닫지 않아요. 집에 가져가서도 바삭하게 드실 수 있도록 세심하게 챙겨요.","chip":"매장 운영 정보","cesco":0,"q":"포장하면 눅눅해지지 않나요?","metric":-1},{"label":"국내산 생닭 사용","title":"어떤 닭을 사용하는지,<br>원산지까지 꼼꼼하게 확인해요.","copy":"치킨을 주문할 때 어떤 닭을 사용하는지도 궁금하실 텐데요. 우리는 국내산 생닭을 사용하고 원산지를 메뉴판과 매장에 표시해요. 세스코도 정기 점검 시 거래명세서를 통해 원산지 표시 내용을 확인해요.","chip":"세스코 확인 · 국내산 닭","cesco":1,"q":"어떤 닭을 쓰세요?","metric":-1},{"label":"홀 테이블·소스통 관리","title":"다음 손님도 깨끗하게 이용할 수 있도록<br>테이블과 소스통을 관리해요.","copy":"손님이 바뀔 때마다 테이블은 물론 여러 사람이 사용하는 소스통과 양념 그릇도 다시 살펴야 해요. 이곳은 손님이 나가면 테이블을 두 번 닦고 소스통과 양념 그릇도 새로 준비해요. 다음 손님이 처음부터 기분 좋게 식사할 수 있도록요.","chip":"매장 운영 정보","cesco":0,"q":"테이블이랑 소스통은요?","metric":-1},{"label":"배달 용기·위생 장갑","title":"매장에서 먹는 음식도, 집으로 배달하는 음식도<br>같은 기준으로 관리해요.","copy":"배달 음식은 조리하는 모습을 직접 볼 수 없기에 위생 관리가 더욱 궁금할 수 있어요. 이곳은 조리할 때 위생장갑을 착용하고, 완성된 음식은 용기에 담아 밀봉해요. 배달 주문에도 매장과 동일한 조리·위생 기준을 적용해요.","chip":"매장 운영 정보","cesco":0,"q":"배달은 매장이랑 다른 게 있어요?","metric":-1}],"dh":[{"label":"튀김 기름 교체 주기","title":"기름은 정해 둔 날<br>통째로 갈아요","copy":"튀김 기름은 정해 둔 요일에 통째로 교체해요. 새 기름을 조금씩 보충하는 것으로 대신하지 않아요. 세스코는 산가(기름의 산패 정도를 나타내는 수치)를 측정해 상태를 확인해요.","chip":"세스코 실측 · 튀김유 산가","cesco":1,"q":"기름은 언제 갈아요?","metric":0},{"label":"생닭 보관 온도","title":"생닭은 받자마자<br>냉장 보관해요","copy":"생닭이 들어오면 바로 냉장고에 넣고 0~5℃에서 보관해요. 매일 온도를 확인하고, 세스코 점검 때도 보관 온도를 측정해요.","chip":"세스코 실측 · 생닭 냉장 온도","cesco":1,"q":"닭은 어떻게 보관해요?","metric":1},{"label":"염지·숙성 시간","title":"맛을 일정하게 유지하려고<br>염지 시간을 지켜요","copy":"닭의 맛은 염지 시간과 보관 온도에 따라서도 달라질 수 있어요. 그래서 정해진 시간에 맞춰 염지하고, 조리 전까지 냉장 상태를 유지해요.","chip":"세스코 실측 · 냉장 보관 온도","cesco":1,"q":"염지는 어떻게 해요?","metric":1},{"label":"도마·칼 색 구분","title":"생닭용 칼과 도마는<br>따로 사용해요","copy":"생닭을 손질하는 칼과 도마는 따로 구분해 써요. 다른 재료에 닿지 않도록 용도를 나누고, 세스코는 조리도구 표면의 오염도를 측정해요.","chip":"세스코 실측 · 칼·도마 ATP","cesco":1,"q":"생닭용 칼과 도마는 따로 쓰나요?","metric":2},{"label":"두 번 튀김·조리 온도","title":"온도를 확인하며<br>두 번 튀겨요","copy":"같은 닭이라도 튀기는 온도와 시간에 따라 식감이 달라져요. 저희는 조리 온도를 확인하고 두 번에 나눠 튀겨요. 조금 더 손이 가더라도 바삭한 식감을 유지하기 위한 조리 방식이에요.","chip":"매장 기록","cesco":0,"q":"두 번 튀기는 이유가 있어요?","metric":-1},{"label":"후드·덕트 청소 주기","title":"후드와 배기 덕트는<br>안쪽까지 청소해요","copy":"튀김 과정에서 생긴 기름때는 후드와 배기 덕트 안쪽에도 쌓일 수 있어요. 그래서 겉면뿐 아니라 안쪽까지 정기적으로 청소해요. 주방 공기 상태는 세스코가 별도로 측정해요.","chip":"세스코 실측 · 주방 공기","cesco":1,"q":"후드 청소는 누가, 얼마나 자주 해요?","metric":3},{"label":"포장 방식","title":"포장 후에도 바삭하도록<br>신경 써요","copy":"갓 튀긴 치킨을 바로 밀폐하면 김 때문에 눅눅해질 수 있어요. 김이 빠지도록 포장 상자에 구멍을 내고, 뚜껑도 바로 닫지 않아요.","chip":"매장 기록","cesco":0,"q":"포장하면 눅눅해지지 않나요?","metric":-1},{"label":"닭 호수·원산지 표시","title":"국내산 생닭을 사용하고<br>원산지를 안내해요","copy":"저희는 국내산 생닭을 사용하고 원산지를 메뉴판과 매장에 표시해요. 세스코는 정기 점검 때 거래명세서와 원산지 표시 내용을 확인해요.","chip":"매장 기록","cesco":0,"q":"어떤 닭을 쓰세요?","metric":-1},{"label":"홀 테이블·소스통 관리","title":"테이블뿐 아니라<br>소스통까지 관리해요","copy":"손님이 나간 뒤 테이블을 닦고, 소스통과 양념 그릇도 다음 손님이 사용할 수 있도록 다시 준비해요.","chip":"매장 기록","cesco":0,"q":"소스통과 양념 그릇도 손님마다 확인하나요?","metric":-1},{"label":"배달 용기·위생 장갑","title":"배달 음식도<br>같은 위생 기준으로 준비해요","copy":"배달 주문도 매장 식사와 같은 위생 기준으로 조리해요. 조리 과정에서 위생장갑을 사용하고, 배달 용기는 밀봉해 보내요.","chip":"매장 기록","cesco":0,"q":"배달 주문도 같은 기준으로 조리하나요?","metric":-1}],"baseKeys":["튀김 기름 교체 주기","생닭 보관 온도","염지·숙성 시간","도마·칼 색 구분","두 번 튀김·조리 온도","후드·덕트 청소 주기","포장 방식","국내산 생닭 사용","홀 테이블·소스통 관리","배달 용기·위생 장갑"],"dhKeys":["튀김 기름 교체 주기","생닭 보관 온도","염지·숙성 시간","도마·칼 색 구분","두 번 튀김·조리 온도","후드·덕트 청소 주기","포장 방식","닭 호수·원산지 표시","홀 테이블·소스통 관리","배달 용기·위생 장갑"],"parent":null,"why":"","note":"11/3본: \"국내산 생닭 사용\"(세스코 확인) / 다해본: \"닭 호수·원산지 표시\"(매장 기록)"},{"id":"e13","kind":"text","path":["D","chicken","items en","items",{"k":"홀 테이블·소스통 관리"},"q"],"label":["치킨집","POINT 항목","홀 테이블·소스통 관리","질문"],"base":"테이블이랑 소스통은요?","dh":"소스통과 양념 그릇도 손님마다 확인하나요?","parent":"e12","why":"","note":""},{"id":"e34","kind":"text","path":["D","chicken","items",{"k":"배달 용기·위생 장갑"},"title"],"label":["치킨집","POINT 항목","배달 용기·위생 장갑","제목"],"base":"매장에서 먹는 음식도, 집으로 배달하는 음식도<br>같은 기준으로 관리해요.","dh":"배달 음식도<br>같은 위생 기준으로 준비해요","parent":"e12","why":"제목을 2줄로 짧게 (모바일)","note":""},{"id":"e35","kind":"text","path":["D","chicken","items",{"k":"배달 용기·위생 장갑"},"copy"],"label":["치킨집","POINT 항목","배달 용기·위생 장갑","본문"],"base":"배달 음식은 조리하는 모습을 직접 볼 수 없기에 위생 관리가 더욱 궁금할 수 있어요. 이곳은 조리할 때 위생장갑을 착용하고, 완성된 음식은 용기에 담아 밀봉해요. 배달 주문에도 매장과 동일한 조리·위생 기준을 적용해요.","dh":"배달 주문도 매장 식사와 같은 위생 기준으로 조리해요. 조리 과정에서 위생장갑을 사용하고, 배달 용기는 밀봉해 보내요.","parent":"e12","why":"","note":""},{"id":"e36","kind":"text","path":["D","chicken","items",{"k":"배달 용기·위생 장갑"},"chip"],"label":["치킨집","POINT 항목","배달 용기·위생 장갑","출처 칩"],"base":"매장 운영 정보","dh":"매장 기록","parent":"e12","why":"","note":"정하실 것: 용어 (\"매장 운영 정보\" / \"매장 기록\")"},{"id":"e37","kind":"text","path":["D","chicken","items",{"k":"배달 용기·위생 장갑"},"q"],"label":["치킨집","POINT 항목","배달 용기·위생 장갑","질문"],"base":"배달은 매장이랑 다른 게 있어요?","dh":"배달 주문도 같은 기준으로 조리하나요?","parent":"e12","why":"","note":""},{"id":"e38","kind":"text","path":["D","chicken","edit","about"],"label":["치킨집","사업주 편집 예시","소개"],"base":"성수동에서 17년째 가마솥에 닭을 튀기는 집이다. 염지를 하지 않고, 주문이 들어오면 생닭을 바로 기름에 넣는다. 소금 맛 하나로 먹는 옛날 통닭. 아버지가 정한 방식을 아들이 그대로 지킨다.","dh":"성수동에서 17년째 가마솥에 옛날통닭을 튀기는 집이에요. 염지 없이 주문이 들어오면 바로 튀겨 소금에 찍어 먹는 통닭을 내요. 아버지가 정한 방식이라 지금도 그대로 지키고 있어요.","parent":null,"why":"사업주 예시도 해요체로","note":""},{"id":"e39","kind":"text","path":["D","chicken","edit","pts","0"],"label":["치킨집","사업주 편집 예시","POINT 문구","0"],"base":"가마솥 기름은 월·수·금 새벽에 통째로 갈아요. 가마솥은 기름이 많이 들어가서 아까워도 그렇게 해요. 오래된 기름은 닭 색부터 거무튀튀해지거든요. 세스코가 산가 재러 오는 날도, 안 오는 날도 똑같아요.","dh":"가마솥 기름은 월·수·금 새벽마다 통째로 갈아요. 기름이 많이 들어가서 아깝긴 하죠. 그래도 오래된 기름은 통닭 색부터 달라져요. 세스코가 산가를 재러 오는 날에도, 안 오는 날에도 똑같이 해요.","parent":null,"why":"","note":""},{"id":"e40","kind":"text","path":["D","chicken","edit","say"],"label":["치킨집","사업주 편집 예시","한마디"],"base":"염지도 안 하고, 기름도 안 아껴요. 그게 다예요.","dh":"염지는 안 해요. 대신 기름은 아끼지 않아요.","parent":null,"why":"","note":""},{"id":"e41","kind":"text","path":["D","chicken","hcards","src"],"label":["치킨집","세스코 관리 카드","작성 메모"],"base":"초안 · 엑셀 ①시트 2안 구조(이유 한 줄 + 관리 두 줄 + 다짐 한 줄)로 작성, 치킨집 행은 엑셀에 없음 [확인 필요]","dh":"초안 · 엑셀 ①시트에 치킨집 행이 없어 같은 형식으로 작성 [확인 필요]","parent":null,"why":"","note":""},{"id":"e42","kind":"array","path":["D","chicken","hcards","cards"],"label":["치킨집","세스코 관리 카드","카드"],"base":[["FOOD","오래 쓴 기름은 산패돼 독성물질까지 생겨요!","산가 측정기로 튀김유를 재서<br>산가 1.0 이하로 관리해요.<small>법적 기준 3.0보다 훨씬 깐깐한, 갓 짠 기름 수준이에요.<\/small>","식품안전 솔루션","튀김유 산가"],["FOOD","생닭은 실온에서 세균이 가장 빨리 늘어요!","입고 즉시 0~5℃ 냉장 보관하고<br>상온 노출 시간을 최소로 줄여요.<small>보관 온도는 매일 기록으로 확인해요.<\/small>","식품안전 솔루션","생닭 보관 온도"],["FOOD","생닭 만진 칼과 도마는 세균 증식 위험!","생닭용 칼·도마를 따로 두고<br>사용 전후 꼼꼼하게 세척·소독해요.<small>오염도 200RLU 이하, 식품 공장 권장 기준이에요.<\/small>","식품안전 솔루션","칼·도마 위생"],["IHM","후드에 쌓인 기름때는 발암물질이자 화재 원인!","후드부터 배기 덕트까지<br>월 1회 전문 클리닝으로 걷어내요.<small>안 보이는 곳도 깨끗하게 관리해요.<\/small>","전문클리닝 솔루션","후드·배기 청소"],["AIR","튀김 연기 속엔 초미세먼지가 가득!","초미세먼지부터 VOCs까지 걸러내는<br>공기청정기를 24시간 가동해요.<small>병원 공용 공간 수준의 공기질로 관리해요.<\/small>","에어 솔루션","주방 공기질"],["IPM","기름과 음식물 냄새는 바퀴벌레와 파리를 불러요!","월 1회 이상 전문 방제로 점검하고<br>해충이 들어오는 길목부터 막아요.<small>보이지 않는 곳까지 세스코가 확인해요.<\/small>","종합방제 솔루션","해충 방제"]],"dh":[["FOOD","튀김 기름을 오래 사용하면 산패가 진행돼 치킨의 맛과 품질에 영향을 줄 수 있어요.","세스코는 기름의 산가(산패 정도를 나타내는 수치)를 측정해 관리 기준과 비교해요.","식품안전 솔루션","튀김유 산가"],["FOOD","생닭은 냉장 온도가 높아지면 세균이 증식하기 쉬워요.","생닭의 보관 온도를 측정해 0~5℃ 범위에서 냉장 관리하는지 확인해요.","식품안전 솔루션","생닭 보관 온도"],["FOOD","생닭을 손질한 칼과 도마를 다른 식재료에도 사용하면 오염이 옮겨갈 수 있어요.","생닭용 칼과 도마를 구분해 쓰고, 사용 후 세척·소독하는지 확인해요.","식품안전 솔루션","칼·도마 위생"],["IHM","튀김할 때 나온 기름때는 눈에 잘 띄지 않는 후드와 배기 덕트 안쪽에도 쌓일 수 있어요.","후드와 배기 덕트 안쪽을 정기적으로 전문 클리닝해 쌓인 기름때를 관리해요.","전문클리닝 솔루션","후드·배기 청소"],["AIR","튀김할 때 생기는 연기와 미세입자는 주방 공기에도 영향을 줄 수 있어요.","공기청정기를 24시간 가동하고, 주방 공기 상태를 함께 살펴봐요.","에어 솔루션","주방 공기질"],["I ":["D","care","items"],"label":["산후조리원","POINT 항목"],"base":[{"label":"공기 살균","title":"세균과 바이러스도 안심!<br>공기청정살균기를 24시간 가동해요","copy":"안전하게 보호받아야 하는 엄마와 아기를 위해, 인플루엔자·코로나 바이러스 99.99%, 폐렴균 99.9%까지 제거하는 공기청정살균기로 공기질까지 관리하고, 공기 중 부유세균을 150 CFU/m³ 이하로 유지해요. 공기 중 부유세균이 산후조리원 법정 기준의 5분의 1 수준이라 안심할 수 있어요.","chip":"세스코 실측 · 신생아실 부유세균","cesco":1,"q":"신생아실 공기는 어떻게 관리해요?","metric":0},{"label":"젖병·수건 아기별 구분","title":"아기 입과 피부에 직접 닿는 젖병과 수건은<br>아기마다 따로 관리해요.","copy":"신생아가 매일 사용하는 젖병과 수건은 다른 아기의 물품과 섞이지 않도록 관리하는 것이 중요해요. 그래서 아기마다 물품을 구분해 사용하고, 매일 정해진 절차에 따라 고온 살균해 청결하게 관리해요.","chip":"세스코 실측 · 젖병 내부 ATP","cesco":1,"q":"젖병과 수건은 아기별로 구분하나요?","metric":1},{"label":"전문 살균·소독","title":"산후조리원 모든 공간을<br>1달에 한 번 꼼꼼하게 살균해요","copy":"신생아실, 산모 방, 수유실까지 세스코 전문가가 1달에 한 번 이상 살균·소독해요. 손이 자주 닿는 집기는 조리원에서 꼼꼼히 살균·소독하고요. 진행 내역과 방법을 정기점검 때 전문가와 함께 다시 한 번 체크해요.","chip":"세스코 확인 · 전문 살균","cesco":1,"q":"소독은 누가 얼마나 자주 해요?","metric":-1},{"label":"면회·출입 관리","title":"소중한 아기들을 위해<br>신생아실 면회와 외부인 출입을 관리해요.","copy":"면회객의 출입이 잦아지면 외부의 감염원이 신생아실로 유입될 가능성도 높아져요. 이곳은 면회 시간과 인원을 정하고, 아기는 창 너머로 볼 수 있도록 운영해요. 보호자는 휴대전화로도 아기의 모습을 확인할 수 있어요.","chip":"시설 운영 정보","cesco":0,"q":"면회는 어떻게 해요?","metric":-1},{"label":"수유실 소독 주기","title":"수유실,<br>정기적으로 소독해요.","copy":"수유실은 여러 산모가 하루에도 몇 번씩 이용하는 공간이에요. 소파와 손잡이처럼 자주 접촉하는 곳은 그만큼 꾸준한 관리가 필요하죠. 정해진 간격으로 소독하고, 시간과 담당자까지 기록해 빠짐없이 관리해요.","chip":"세스코 실측 · 수유실 손잡이 ATP","cesco":1,"q":"수유실 소독은 얼마나 자주 해요?","metric":2},{"label":"침구·세탁 동선 분리","title":"산모와 아기가 사용하는 침구는 매일 교체하고,<br>세탁 전후 동선까지 구분해요.","copy":"매일 사용하는 침구는 깨끗하게 세탁하는 것만큼 세탁 후 보관과 이동 과정도 중요해요. 이곳은 침구를 매일 교체하고 속싸개는 하루 두 번 바꿔요. 세탁 전후 물품이 섞이지 않도록 이동 동선까지 나눠 관리해요.","chip":"세스코 확인 · 세탁 동선","cesco":1,"q":"침구랑 세탁은요?","metric":-1},{"label":"산모식 식재료·조리실","title":"산모의 식사는 맛도 위생도 중요하니까<br>식품위생법을 철저하게 지켜요!","copy":"식자재가 들어오는 순간부터 보관하는 방법, 조리, 배식까지 식사에 관한 모든 과정을 식품위생법 기준대로 철저하게 지켜요. 조리 공간의 위생 여부도 세스코 전문가가 깐깐하게 점검해요.","chip":"세스코 실측 · 산모식 조리대 ATP","cesco":1,"q":"산모식은 누가 어떻게 만들어요?","metric":3},{"label":"좌욕기·비데 소독","title":"산모의 피부에 직접 닿는 좌욕기와 비데는<br>사용 후 바로 소독해요.","copy":"출산 후 회복을 위해 사용하는 좌욕기와 비데는 여러 사람이 함께 사용하는 만큼 위생 관리가 중요해요. 이곳은 사용할 때마다 바로 소독하고, 정해진 순서에 따라 관리해 다음 산모도 청결하게 이용할 수 있도록 해요.","chip":"세스코 실측 · 좌욕기 ATP","cesco":1,"q":"좌욕기는 쓰고 나면요?","metric":-1},{"label":"신생아실 야간 운영","title":"엄마가 쉬는 밤에도 아기를 세심하게 돌볼 수 있도록<br>간호 인력이 함께해요.","copy":"신생아는 밤에도 수유와 돌봄이 필요해요. 이곳은 야간에도 신생아실에 간호 인력을 배치해 아기를 돌보고 있어요. 보호자는 휴대전화로 아기의 모습을 확인할 수 있도록 운영해요.","chip":"시설 운영 정보","cesco":0,"q":"밤에는 신생아실에 누가 있어요?","metric":-1},{"label":"간호 인력","title":"아기의 작은 변화도 세심하게 살필 수 있도록<br>간호사가 상주해요.","copy":"신생아는 스스로 불편함을 표현하기 어려운 만큼 곁에서 세심하게 살펴주는 사람이 필요해요. 이곳은 신생아실에 간호사가 상주하고, 원장도 직접 돌아보며 아기들의 상태를 살펴요. 보호자가 궁금한 점도 담당자에게 바로 물어볼 수 있어요.","chip":"시설 운영 정보","cesco":0,"q":"신생아실은 누가 봐요?","metric":-1}],"dh":[{"label":"신생아실 공기 수치 공개","title":"신생아실 공기 측정 결과를<br>정기적으로 공개해요","copy":"세스코가 신생아실 공기 중 부유세균을 정기적으로 측정해요. 측정 결과는 복도에 게시해 보호자도 확인할 수 있도록 하고 있어요.","chip":"세스코 실측 · 신생아실 부유세균","cesco":1,"q":"신생아실 공기 상태는 어떻게 확인해요?","metric":0},{"label":"젖병·수건 아기별 구분","title":"젖병과 수건은<br>아기마다 따로 관리해요","copy":"젖병과 수건은 아기별로 구분해 다른 아기의 물품과 섞이지 않도록 해요. 사용한 용품은 정해진 절차에 따라 세척하고, 매일 고온 살균해요.","chip":"세스코 실측 · 젖병 내부 ATP","cesco":1,"q":"젖병과 수건은 아기별로 구분하나요?","metric":1},{"label":"산모 방 창·환기","title":"산모 방은 정해진 시간에<br>환기해요","copy":"산모가 오래 머무는 객실인 만큼, 정해진 시간에 창문을 열어 환기해요.","chip":"매장 기록 · 객실 환기","cesco":0,"q":"객실은 어떻게 환기하나요?","metric":-1},{"label":"면회·출입 관리","title":"신생아실 면회는<br>창 너머로 진행해요","copy":"신생아실 면회는 창 너머에서 진행해요. 외부 방문객은 정해진 시간과 인원 기준에 따라 출입을 안내하고 있어요.","chip":"조리원 관리 안내","cesco":0,"q":"신생아실 면회는 어떻게 하나요?","metric":-1},{"label":"수유실 소독 주기","title":"수유실, 정기적으로<br>소독해요","copy":"여러 산모가 사용하는 수유실은 소파와 손잡이처럼 손이 자주 닿는 곳을 정기적으로 소독해요. 소독한 시간과 담당자도 기록해 관리해요.","chip":"세스코 실측 · 수유실 손잡이 ATP","cesco":1,"q":"수유실은 얼마나 자주 소독하나요?","metric":2},{"label":"침구·세탁 동선 분리","title":"침구는 매일 교체하고<br>세탁 동선도 구분해요","copy":"침구는 매일 교체하고 속싸개는 하루 두 번 바꿔요. 사용한 침구와 세탁을 마친 침구가 섞이지 않도록 이동 경로도 구분해요.","chip":"세스코 확인 · 세탁 동선","cesco":1,"q":"침구는 어떻게 세탁하고 관리하나요?","metric":-1},{"label":"산모식 식재료·조리실","title":"산모식은 식재료 보관부터<br>조리대 위생 RUSCARE","면역력 약한 아기에겐 공기 속 세균도 위험!","공기 중 부유세균을 150 CFU/m³ 이하로 유지해요. 산후조리원 법정 기준의 5분의 1 수준으로 낮아요.","바이러스케어 솔루션","공기 살균"],["VIRUSCARE","작은 세균도 조심해야 할 때!","전문 방역업체가 월 1회 이상 살균·소독하고 집기는 수시로 살균·소독해요.","바이러스케어 솔루션","전문 살균"],["VIRUSCARE","젖병 하나로도 번지는 교차 감염!","아기마다 개별로 구분해서 매일 고온 살균으로 관리해요.","바이러스케어 솔루션","신생아 용품 살균"],["BODYCARE","출산 후 산모의 몸은 감염에 특히 취약!","안심하고 회복할 수 있도록 청결 관리를 돕는 비데를 전 객실에 설치했어요.","바디케어 솔루션","비데 위생 관리"],["FOOD","회복하는 동안 하루 세 끼 먹는 조리원 밥!","식자재 입고부터 조리, 배식, 보관까지 모든 과정을 국내 식품위생법 기준으로 운영해요.","식품안전 솔루션","산모 식재료 위생"]],"dh":[["VIRUSCARE","여러 사람이 함께 사용하는 공간은 손이 닿는 물건을 통해 오염이 옮겨갈 수 있어요.","공용 공간은 월 1회 이상 전문 살균·소독하고, 손이 자주 닿는 물품도 수시로 관리해요.","바이러스케어 솔루션","전문 살균"],["VIRUSCARE","아기들이 함께 지내는 곳에서는 젖병과 수건이 서로 섞이지 않도록 관리해야 해요.","젖병과 수건을 아기마다 구분해 사용하고, 정해진 절차에 따라 매일 고온 살균해요.","바이러스케어 솔루션","신생아 용품 살균"],["VIRUSCARE","여러 아기가 함께 지내는 신생아실은 공기 중에 떠다니는 세균도 살펴야 해요.","신생아실의 공기 중 부유세균을 측정해 관리 기준과 비교해요. 부유세균은 공기 중에 떠다니는 세균을 말해요.","바이러스케어 솔루션","신생아실 공기 점검"],["BODYCARE","여러 산모가 사용하는 비데는 피부에 닿는 부분을 깨끗하게 관리하는 것이 중요해요.","전 객실에 설치된 비데의 청결 관리 상태를 확인해요.","바디케어 솔루션","비데 위생 관리"],["FOOD","산모에게 제공하는 식사는 식재료를 보관할 때부터 조리하고 배식할 때까지 위생 관리가 필요해요.","산모식에 쓰는 식재료의 보관 상태와 조리·배식 과정을 확인해요.","식품안전 솔루션","산모 식재료 위생"]],"parent":null,"why":"","note":"11/2 팀장님 피드백(엑셀 2안: 훅 + 숫자) 형식이 11/3본이에요. 다만 근거 대기 어려운 표현(독성물질, 발암물질 등)은 직접 수정으로 낮출 수 있어요."},{"id":"e180","kind":"text","path":["D","care","aicard","intro"],"label":["산후조리원","위쳌 AI 카드","소개"],"base":"면역력이 약한 신생아와 산모가 오래 머무는 곳이라 공기질부터 손 자국이 남을 수 있는 곳까지 더 꼼꼼하게 관리해요.","dh":"세스코가 신생아실 공기와 아기 용품, 공용 공간의 위생 관리 상태를 살펴봤어요.","parent":null,"why":"","note":""},{"id":"e181","kind":"array","path":["D","care","aicard","checks"],"label":["산후조리원","위쳌 AI 카드","체크 3줄"],"base":["전문 방역업체가 월 1회 이상 전체 살균·소독해요.","젖병·수건은 아가별로 구분하고, 매일 고온 살균해요.","신생아실 공기청정살균기를 24시간 가동해요."],"dh":["공용 공간을 정해진 주기에 따라 살균·소독하는지 확인했어요.","젖병과 수건을 아기별로 구분해 사용하는지 살펴봤어요.","신생아실 공기 중 부유세균을 측정했어요."],"parent":null,"why":"11/3 문구 유지, \"아가별로\" → \"아기별로\"만 수정","note":"","custom":["전문 방역업체가 월 1회 이상 전체 살균·소독해요.","젖병·수건은 아기별로 구분하  곰팡이로 가득한 공기를 숨 쉬지 않도록! 에어컨 내부 분해 세척을 연 2회 이상 진행하는 것을 확인했습니다."],["IHM","가습기는 정기적으로 소독해요","가습기에서 세균 가득한 수증기를 뿜지 않도록! 단순 청소가 아닌 정기 소독으로 관리하는 것을 체크했습니다."]],"dh":[["CHECK","모자동실을 이용할 수 있어요","산모가 아기와 같은 방에서 지낼 수 있는 모자동실을 운영해요. 자세한 이용 방식은 조리원에 확인해 주세요."],["CHECK","신생아실 모습을 휴대전화로 볼 수 있어요","보호자가 휴대전화로 신생아실을 볼 수 있는 CCTV 서비스를 운영해요. 이용 시간과 대상은 조리원에 확인해 주세요."],["CHECK","직원 손소독 기록을 관리해요","직원의 손 소독 기록을 관리하는지 확인했어요."],["CHECK","매트리스 관리 방법을 안내해요","조리원 안내에 따르면 산모가 사용한 뒤 매트리스를 스팀 소독하고, 한 달에 한 번 위생 관리 서비스를 받고 있어요."],["CHECK","수건과 침구 세탁에 사용하는 세제를 확인해요","수건과 옷, 담요를 세탁할 때 어떤 세제를 사용하는지 확인했어요."],["CHECK","손이 자주 닿는 곳은 하루 3회 소독해요","조리원은 문손잡이처럼 손이 자주 닿는 곳을 하루 세 차례 소독한다고 안내하고 있어요."],["CHECK","좌욕기는 사용 후 바로 소독해요","조리원은 좌욕기를 사용한 뒤 소독하고, 한 달에 한 번 분해 세척한다고 안내하고 있어요."],["IHM","에어컨은 연 2회 분해 세척해요","에어컨 내부를 연 2회 이상 분해 세척하는지 관리 기록을 확인했어요."],["CHECK","가습기는 정기적으로 세척·소독해요","가습기 내부를 정해진 주기에 따라 세척·소독한다고 안내하고 있어요."]],"parent":null,"why":"","note":""},{"id":"e190","kind":"array","path":["D","care","placeinfo","sources"],"label":["산후조리원","장소정보","출처 라벨"],"base":null,"dh":["조리원 안내","조리원 안내","기록 관리 확인","조리원 안내","사용 세제 확인","조리원 안내","조리원 안내","관리 기록 확인","조리원 안내"],"parent":null,"why":"세스코 확인/매장 안내 구분 라벨","note":"지금 11/3 화면 코드는 이 라벨을 표시하지 않아요. 확정할 때 화면 코드도 같이 옮겨요."},{"id":"e191","kind":"array","path":["D","care","placemeta"],"label":["산후조리원","장소정보 질문"],"base":[["🧼","청결","직원분들 손 소독은요?","손소독 기록 확인"],["🛏️","청결","침대는 깨끗해요?","매트리스 스팀"],["🧺","청결","아기 수건은 뭘로 빨아요?","세탁 세제 확인"],["🚪","시설 관리","손잡이 같은 데 소독해요?","접촉면 3회 소독"],["🛁","시설 관리","좌욕기 같이 써도 괜찮아요?","좌욕기 즉시 소독"],["❄️","시설 관리","에어컨 청소는요?","에어컨 분해 세척"],["💨","시설 관리","가습기 관리해요?","가습기 소독"]],"dh":[["🍼","산모·아기","아기와 같은 방에서 지낼 수 있나요?","모자동실"],["📹","산모·아기","신생아실 CCTV는 언제 볼 수 있나요?","CCTV 이용 안내"],["🧼","청결","직원의 손 위생은 어떻게 관리하나요?","손소독 기록 확인"],["🛏️","청결","침대 매트리스는 어떻게 관리하나요?","매트리스 스팀"],["🧺","청결","아기 수건에는 어떤 세제를 쓰나요?","세탁 세제 확인"],["🚪","시설 관리","손이 자주 닿는 곳은 얼마나 자주 소독하나요?","접촉면 3회 소독"],["🛁","시설 관리","여러 사람이 쓰는 좌욕기는 어떻게 소독하나요?","좌욕기 즉시 소독"],["❄️","시설 관리","에어컨 내부는 얼마나 자주 청소하나요?","에어컨 분해 세척"],["💨 function ops(){ const out=[]; for(const e of E){ const s=S[e.id]; const pd=e.parent&&S[e.parent]&&S[e.parent].c==='dh'; if(s.c==='base'&&!pd) continue; const v=s.c==='base'?e.base:s.c==='dh'?e.dh:s.v; out.push({p:e.path,v:v===undefined?null:v,list:e.kind==='list'?1:0}); } return out; }
let tmr=null; function save(){ LS.set(KS,JSON.stringify(S)); const o=ops(); LS.set(KO,JSON.stringify(o)); document.getElementById('st').textContent='자동 저장 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · 반영 '+o.length+'곳'; clearTimeout(tmr); tmr=setTimeout(()=>{ try{ document.getElementById('ifr').contentWindow.postMessage({type:'wc-ops',ops:o},'*'); }catch(x){} },250); }
function setC(id,c){ const e=byId[id]; const s=S[id]; if(c==='edit'&&s.c!=='edit'){ s.v=s.c==='dh'?e.dh:e.base; } s.c=c; if(e.kind==='list'){ E.filter(x=>x.parent===id).forEach(x=>{ if(S[x.id].c!=='edit') S[x.id].c=c; }); } save(); const el=document.querySelector('.card[data-id="'+id+'"]'); if(el){ el.outerHTML=cardHtml(e); } if(e.kind==='list') renderList(); renderTabs(); }
document.addEventListener('click',ev=>{ const t=ev.target.closest('[data-ind]'); if(t){ cur=t.dataset.ind; loadPv(); renderList(); return; }
 const b=ev.target.closest('.seg button, .col[data-c]'); if(b){ const id=b.closest('.card').dataset.id; setC(id,b.dataset.c); return; } });
document.addEventListener('input',ev=>{ const ta=ev.target.closest('textarea[data-ta]'); if(!ta) return; const id=ta.dataset.ta, e=byId[id]; S[id]={c:'edit',v:fromText(e,ta.value)}; const card=ta.closest('.card'); card.className='card ch-edit'; card.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.c==='edit')); card.querySelectorAll('.col').forEach(x=>x.classList.remove('on')); save(); renderTabs(); });
document.getElementById('flt').onchange=e=>{flt=e.target.value;renderList();};
document.getElementById('bRec').onclick=()=>{ if(confirm('추천안(처음 상태)으로 되돌릴까요? 직접 수정한 내용도 지워져요.')){ S=defState(); save(); renderList(); } };
document.getElementById('bBase').onclick=()=>{ if(confirm('전부 11/3 보고본으로 되돌릴까요?')){ E.forEach(e=>S[e.id]={c:'base'}); save(); renderList(); } };
function dl(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
document.getElementById('bJson').onclick=()=>dl('위쳌_선택결과_261109.json',JSON.stringify({saved:new Date().toISOString(),state:S,ops:ops()},null,1),'application/json');
document.getElementById('bHtml').onclick=async()=>{ const f=FILE[cur]; const t=await (await fetch(f+'?t='+Date.now())).text(); const out=t.replace(/\/\*WC_BAKED\*\/[\s\S]*?\/\*END_WC_BAKED\*\//,'/*WC_BAKED*/'+JSON.stringify(ops())+'/*END_WC_BAKED*/'); dl(f,out,'text/html'); };
function fit(){ const w=document.getElementById('pvwrap').clientWidth; const ifr=document.getElementById('ifr'); ifr.style.transform='scale('+(w/1320)+')'; }
function loadPv(){ const f=FILE[cur]; const ifr=document.getElementById('ifr'); ifr.src=f+'?draft=1&t='+Date.now(); document.getElementById('pvt').textContent='통합본 미리보기 · '+IND.find(x=>x[0]===cur)[1]; document.getElementById('lnkC').href=f; document.getElementById('lnkB').href=ORIG[cur]; document.getElementById('lnkD').href=DHF[cur]; }
document.getElementById('ifr').addEventListener('load',()=>{ try{ document.getElementById('ifr').contentWindow.postMessage({type:'wc-ops',ops:ops()},'*'); }catch(x){} });
window.addEventListener('resize',fit);
save(); loadPv(); renderList(); fit();
</script></body></html>
