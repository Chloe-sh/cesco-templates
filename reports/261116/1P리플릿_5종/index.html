<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>제품 리플릿 1P · 5종</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>
:root{--ink:#111;--ink2:#444;--line:#e3e3e3;--soft:#f5f7fa;--blue:#0072CE}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;word-break:keep-all}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.in{max-width:1200px;margin:0 auto;padding:16px 24px 0}
.kicker{font-size:13px;color:var(--blue);font-weight:700}
h1{font-size:22px;margin:2px 0 12px;font-weight:800}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs a{padding:9px 16px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--soft);color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px}
.tabs a.on{background:var(--blue);border-color:var(--blue);color:#fff}
iframe{display:block;width:100%;border:0;min-height:calc(100vh - 110px)}
</style></head><body>
<div class="bar"><div class="in">
<div class="kicker">세스코 · 11/18 보고 자료</div>
<h1>제품 리플릿 1P</h1>
<nav class="tabs"><a href="#1" data-src="세스코_1P리플릿_마이랩_세탁세제_프리미엄_v2.html">세탁세제 프리미엄</a><a href="#2" data-src="세스코_1P리플릿_에어퍼퓸750_v2.html">에어퍼퓸 750</a><a href="#3" data-src="세스코_1P리플릿_블루제닉_변기세정기_시그니처.html">변기세정기 시그니처</a><a href="#4" data-src="세스코_1P리플릿_마이랩_에어퍼퓸디퓨저.html">에어퍼퓸 디퓨저</a><a href="#5" data-src="세스코_1P리플릿_판테온x에어컨클리닝.html">판테온 × 에어컨 클리닝</a></nav>
</div></div>
<iframe id="v" title="제품 리플릿 1P"></iframe>
<script>
const tabs=[...document.querySelectorAll('.tabs a')], fr=document.getElementById('v');
function show(){let i=parseInt(location.hash.slice(1))||1; if(i<1||i>tabs.length)i=1; tabs.forEach((t,k)=>t.classList.toggle('on',k===i-1)); const s=tabs[i-1].dataset.src; if(fr.getAttribute('src')!==s) fr.setAttribute('src',s);}
function fit(){try{const d=fr.contentDocument; if(d&&d.documentElement) fr.style.height=d.documentElement.scrollHeight+'px';}catch(e){}}
fr.addEventListener('load',()=>{fit(); setTimeout(fit,600); setTimeout(fit,1500);});
window.addEventListener('hashchange',show); window.addEventListener('resize',fit); show();
</script>
</body></html>
