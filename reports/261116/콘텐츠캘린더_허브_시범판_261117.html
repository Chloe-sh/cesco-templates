function count(arr,fn){var o={};arr.forEach(function(c){fn(c).forEach(function(v){if(v)o[v]=(o[v]||0)+1})});return Object.keys(o).map(function(k){return [k,o[k]]}).sort(function(a,b){return b[1]-a[1]||a[0].localeCompare(b[0],'ko')})}
// filters
function buildFilters(){var opt=function(id,label,vals,lab){return '<label>'+label+' <select data-f="'+id+'"><option value="">전체</option>'+vals.map(function(v){return '<option value="'+esc(v[0])+'">'+esc(lab?lab(v[0]):v[0])+' ('+v[1]+')</option>'}).join('')+'</select></label>'};
  var ty=count(C,function(c){return [c.type]}),ln=count(C,function(c){return [c.line]}).sort(function(a,b){return LORD.indexOf(a[0])-LORD.indexOf(b[0])});
  $('#filters').innerHTML=opt('type','유형',ty,function(v){return TY[v]||v})+opt('line','라인',ln,function(v){return LN[v]||v})+opt('st','상태',count(C,function(c){return [c.st]}))+opt('maker','시하 담당',count(C,function(c){return c.makers}))+opt('req','세스코 요청자',count(C,function(c){return [c.req.person]}))+'<button class="reset" type="button" id="reset">초기화</button><span class="cnt" id="cnt"></span>';
  Array.prototype.forEach.call(document.querySelectorAll('#filters select'),function(s){s.addEventListener('change',function(){S.f[s.getAttribute('data-f')]=s.value;render()})});
  $('#reset').addEventListener('click',function(){S.q='';$('#q').value='';Object.keys(S.f).forEach(function(k){S.f[k]=''});Array.prototype.forEach.call(document.querySelectorAll('#filters select'),function(s){s.value=''});render()})}
var TABS=[['cal','캘린더'],['topic','주제에서 찾기'],['product','상품에서 찾기'],['list','전체 목록']];
function renderTabs(L){$('#tabs').innerHTML=TABS.map(function(t){var n=t[0]==='topic'?count(L,function(c){return c.topics}).length+'개 주제':t[0]==='product'?count(L,function(c){return c.products}).length+'개 상품':L.length+'건';return '<button type="button" data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'<small>'+n+'</small></button>'}).join('')}
function caseRows(list,cols){return '<table class="cr"><tbody>'+list.map(function(c){return '<tr class="row" data-k="'+c.k+'">'+cols.map(function(col){return col(c)}).join('')+'</tr>'}).join('')+'</tbody></table>'}
var COL={
  date:function(c){return '<td class="nw dim w-d">'+esc(md(dKey(c)))+'</td>'},
  dateY:function(c){return '<td class="nw dim w-dy">'+esc(dKey(c))+'</td>'},
  type:function(c){return '<td class="nw w-t">'+tyB(c.type)+'</td>'},
  name:function(c){return '<td class="nm">'+esc(c.name)+'</td>'},
  prod:function(c){var p=c.products.join(', ');return '<td class="el dim w-p" title="'+esc(p)+'">'+esc(p||'—')+'</td>'},
  who:function(c){return '<td class="el dim w-w">'+who(c)+'</td>'},
  maker:function(c){return '<td class="el dim w-m">'+esc(c.makers.slice(0,2).join(', ')||'—')+'</td>'},
  st:function(c){return '<td class="nw w-s">'+stB(c.st)+'</td>'}};
// calendar
function ymOf(c){var d=dKey(c);return d?d.slice(0,7):''}
function ymAdd(k,n){var y=+k.slice(0,4),m=+k.slice(5,7)+n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+(m<10?'0':'')+m}
function stK(st){return st==='완료'?'완료':st==='진행 중'?'진행':'대기'}
function viewCal(L){var all=C.map(ymOf).filter(Boolean).sort();
  if(!all.length)return '<div class="empty">날짜가 있는 건이 없습니다.</div>';
  var a=all[0],b=all[all.length-1];var by={};L.forEach(function(c){var k=ymOf(c);if(k)(by[k]=by[k]||[]).push(c)});
  if(!S.ym||S.ym<a||S.ym>b){var ks=Object.keys(by).sort();S.ym=ks.length?ks[ks.length-1]:b}
  var yms=[];for(var k=a;k<=b;k=ymAdd(k,1))yms.push(k);
  var list=by[S.ym]||[];var y=+S.ym.slice(0,4),mo=+S.ym.slice(5,7);
  var first=new Date(y,mo-1,1).getDay(),days=new Date(y,mo,0).getDate();
  var byD={};list.forEach(function(c){var d=+dKey(c).slice(8,10);(byD[d]=byD[d]||[]).push(c)});
  var h='<div class="calnav"><button type="button" class="nv" data-ym="'+ymAdd(S.ym,-1)+'"'+(S.ym<=a?' disabled':'')+' aria-label="이전 달">‹</button><h2>'+ymLabel(S.ym)+'<small>'+list.length+'건</small></h2><button type="button" class="nv" data-ym="'+ymAdd(S.ym,1)+'"'+(S.ym>=b?' disabled':'')+' aria-label="다음 달">›</button>';
  h+='<select id="ymsel" aria-label="달 선택">'+yms.slice().reverse().map(function(k){return '<option value="'+k+'"'+(k===S.ym?' selected':'')+'>'+ymLabel(k)+' ('+(by[k]||[]).length+'건)</option>'}).join('')+'</select></div>';
  h+='<div class="calwrap"><div class="cal">'+['일','월','화','수','목','금','토'].map(function(w){return '<div class="dow">'+w+'</div>'}).join('');
  var i;for(i=0;i<first;i++)h+='<div class="day out"></div>';
  for(var d=1;d<=days;d++){var ds=S.ym+'-'+(d<10?'0':'')+d;var it=(byD[d]||[]).slice().sort(function(p,q){return p.name.localeCompare(q.name,'ko')});
    h+='<div class="day'+(ds===D.gen?' today':'')+'"><span class="dn">'+d+'</span>'+it.map(function(c){var t=TY[c.type]||c.type;return '<button type="button" class="ev st-'+stK(c.st)+'" data-k="'+c.k+'" title="'+esc(t+' · '+c.name+' · '+c.st)+'"><i>'+esc(t)+'</i><span>'+esc(c.name)+'</span></button>'}).join('')+'</div>'}
  for(i=(first+days)%7;i>0&&i<7;i++)h+='<div class="day out"></div>';
  h+='</div></div>';
  h+='<p class="note callg"><span class="k st-완료"></span>완료<span class="k st-진행"></span>진행 중<span class="k st-대기"></span>세스코 확인 대기 · 날짜는 첫 송부일(없으면 요청일)입니다.</p>';
  return h}
// topic
function viewTopic(L){var tl=count(L,function(c){return c.topics});
  if(!tl.length)return '<div class="empty">조건에 맞는 주제가 없습니다. 주제 태그가 붙은 건만 이 탭에 나옵니다.</div>';
  if(!S.topic||!tl.some(function(t){return t[0]===S.topic}))S.topic=tl[0][0];
  var side='<div class="side" role="list">'+tl.map(function(t){return '<button type="button" data-topic="'+esc(t[0])+'" class="'+(t[0]===S.topic?'on':'')+'"><span>'+esc(t[0])+'</span><i>'+t[1]+'</i></button>'}).join('')+'</div>';
  var cs=L.filter(function(c){return c.topics.indexOf(S.topic)>=0});
  var pl=count(cs,function(c){return c.products});var none=cs.filter(function(c){return !c.products.length});
  var h='<div class="pane"><h2>'+esc(S.topic)+'</h2><div class="summary">'+esc(S.topic)+' → '+(pl.length?pl.map(function(p){return esc(p[0])}).join(', '):'연결한 상품 없음')+' ('+cs.length+'건)</div>';
  h+='<h3>이 주제를 연결한 상품</h3>';
  pl.forEach(function(p){var list=cs.filter(function(c){return c.products.indexOf(p[0])>=0}).sort(function(a,b){return dKey(b).localeCompare(dKey(a))});
    h+='<h3><button type="button" class="chip" data-product="'+esc(p[0])+'" title="상품에서 찾기로 이동">'+esc(p[0])+'</button><small>'+list.length+'건</small></h3>'+caseRows(list,[COL.type,COL.dateY,COL.name,COL.maker,COL.st])});
  if(none.length)h+='<h3>상품 지정 없음<small>'+none.length+'건</small></h3>'+caseRows(none,[COL.type,COL.dateY,COL.name,COL.maker,COL.st]);
  return '<div class="two">'+side+h+'</div></div>'}
// product
function prodLine(L){var o={};L.forEach(function(c){c.products.forEach(function(p){o[p]=o[p]||{};o[p][c.line]=(o[p][c.line]||0)+1})});var r={};Object.keys(o).forEach(function(p){r[p]=Object.keys(o[p]).sort(function(a,b){return o[p][b]-o[p][a]})[0]});return r}
function viewProduct(L){var pc=count(L,function(c){return c.products});
  if(!pc.length)return '<div class="empty">조건에 맞는 상품이 없습니다.</div>';
  var pl=prodLine(C);var groups={};pc.forEach(function(p){var l=pl[p[0]]||'ETC';(groups[l]=groups[l]||[]).push(p)});
  if(!S.product||!pc.some(function(t){return t[0]===S.product})){var fl=LORD.filter(function(l){return groups[l]})[0];S.product=groups[fl][0][0]}
  var side='<div class="side">'+LORD.filter(function(l){return groups[l]}).map(function(l){return '<div class="grp">'+esc(LN[l])+'</div>'+groups[l].map(function(p){return '<button type="button" data-product="'+esc(p[0])+'" class="'+(p[0]===S.product?'on':'')+'"><span>'+esc(p[0])+'</span><i>'+p[1]+'</i></button>'}).join('')}).join('')+'</div>';
  var cs=L.filter(function(c){return c.products.indexOf(S.product)>=0}).sort(function(a,b){return dKey(b).localeCompare(dKey(a))});
  var h='<div class="pane"><h2>'+esc(S.product)+'</h2><div class="note">'+esc(LN[pl[S.product]]||'')+' · '+cs.length+'건</div>';
  var tl=count(cs,function(c){return c.topics});
  h+='<h3>(가) 이 상품에 쓴 주제<small>'+tl.length+'개</small></h3>'+(tl.length?tl.map(function(t){return '<button type="button" class="chip" data-topic="'+esc(t[0])+'">'+esc(t[0])+'<i>'+t[1]+'</i></button>'}).join(''):'<p class="note">주제 태그 없음(상품 소개 위주 건)</p>');
  var pc2=cs.filter(function(c){return c.points.length});var np=pc2.reduce(function(a,c){return a+c.points.length},0);
  h+='<h3>(나) 강조 포인트<small>'+np+'개 · '+pc2.length+'건</small></h3>'+(pc2.length?'<table class="cr pts"><tbody>'+pc2.map(function(c){return '<tr class="row" data-k="'+c.k+'"><td class="w-pn">'+esc(c.name)+'</td><td>'+c.points.map(esc).join(' · ')+'</td></tr>'}).join('')+'</tbody></table>':'<p class="note">강조 포인트 태그 없음</p>');
  var tys=count(cs,function(c){return [c.type]});
  h+='<h3>(다) 유형별 건 목록</h3>';
  tys.forEach(function(t){var list=cs.filter(function(c){return c.type===t[0]});h+='<div class="note" style="margin-top:10px">'+esc(TY[t[0]]||t[0])+' · '+list.length+'건</div>'+caseRows(list,[COL.dateY,COL.name,COL.who,COL.st])});
  var src=[];cs.forEach(function(c){c.files.forEach(function(f){if(f.stg==='src'||(f.stg==='req'&&f.side==='세스코'))src.push([f,c])})});
  src.sort(function(a,b){return (b[0].d||'').localeCompare(a[0].d||'')});
  h+='<h3>(라) 받은 소재 파일<small>'+src.length+'개</small></h3>'+(src.length?'<div class="files">'+src.map(function(x){var f=x[0];return '<div class="f"><span class="fn">'+esc(f.n)+' <a href="#" class="dim" data-k="'+x[1].k+'">· '+esc(x[1].name)+'</a></span><span class="dim">'+esc(f.d)+'</span><span class="dim">'+esc(STG[f.stg])+'</span></div>'}).join('')+'</div>':'<p class="note">받은 소재로 분류된 파일 없음</p>');
  return '<div class="two">'+side+h+'</div></div>'}
// list
var LCOLS=[['name','건 이름'],['type','유형'],['line','라인'],['prod','상품'],['topic','주제'],['req','요청자(팀)'],['maker','시하 담당'],['dr','요청일'],['d','첫 송부일'],['st','상태'],['how','방식']];
function lval(c,k){switch(k){case 'name':return c.name;case 'type':return TY[c.type]||c.type;case 'line':return LN[c.line]||c.line;case 'prod':return c.products.join(', ');case 'topic':return c.topics.join(', ');case 'req':return c.req.person+(c.req.team?' ('+c.req.team+')':'');case 'maker':return c.makers.join(', ');case 'dr':return c.d_req;case 'd':return c.d_sent;case 'st':return c.st;case 'how':return c.how}}
function viewList(L){var k=S.sort,d=S.dir;var list=L.slice().sort(function(a,b){var x=lval(a,k)||'',y=lval(b,k)||'';if(!x&&y)return 1;if(x&&!y)return -1;return d*x.localeCompare(y,'ko')});
  return '<table class="list"><thead><tr>'+LCOLS.map(function(c){return '<th class="w-'+c[0]+' sort'+(c[0]===k?' on':'')+'" data-sort="'+c[0]+'">'+c[1]+(c[0]===k?(d>0?' ▲':' ▼'):'')+'</th>'}).join('')+'</tr></thead><tbody>'+list.map(function(c){return '<tr class="row" data-k="'+c.k+'"><td class="nm">'+esc(c.name)+'</td><td class="nw">'+esc(TY[c.type]||c.type)+'</td><td class="nw dim">'+esc(LN[c.line]||c.line)+'</td><td class="el" title="'+esc(lval(c,'prod'))+'">'+esc(lval(c,'prod')||'—')+'</td><td class="el dim" title="'+esc(lval(c,'topic'))+'">'+esc(lval(c,'topic')||'—')+'</td><td class="el" title="'+esc(lval(c,'req'))+'">'+esc(c.req.person||'—')+(c.req.team?'<span class="dim tm">'+esc(c.req.team)+'</span>':'')+'</td><td class="el">'+esc(c.makers.join(', ')||'—')+'</td><td class="nw dim">'+esc(yd(c.d_req))+'</td><td class="nw dim">'+esc(yd(c.d_sent)||'—')+'</td><td class="nw">'+stB(c.st)+'</td><td class="el dim" title="'+esc(c.how)+'">'+esc(c.how||'—')+'</td></tr>'}).join('')+'</tbody></table>'}
// detail
function openCase(k){var c=byK[k];if(!c)return;var h='';
  h+='<div class="meta">'+tyB(c.type)+'<span class="b">'+esc(LN[c.line]||c.line)+'</span><span class="b">'+esc(c.kind)+'</span>'+stB(c.st)+'</div><h2>'+esc(c.name)+'</h2>'+(c.brief?'<p class="brief">'+esc(c.brief)+'</p>':'');
  h+='<div class="sec"><h3>누가</h3><dl class="kv"><dt>요청</dt><dd>'+esc(['세스코',c.req.team,c.req.person].filter(Boolean).join(' · '))+'</dd><dt>제작</dt><dd>시하 '+esc(c.makers.join(', ')||'—')+'</dd><dt>기간</dt><dd>요청 '+esc(c.d_req||'—')+' · 첫 송부 '+esc(c.d_sent||'—')+' · 마지막 '+esc(c.d_last||'—')+'</dd></dl></div>';
  h+='<div class="sec"><h3>어떻게</h3><div><b>'+esc(c.how||'방식 미분류')+'</b>'+(c.how_note?' · <span class="dim">'+esc(c.how_note)+'</span>':'')+'</div></div>';
  h+='<div class="sec"><h3>주제 · 상품 · 강조 포인트</h3>'+(c.topics.length?'<div>'+c.topics.map(function(t){return '<button type="button" class="chip" data-topic="'+esc(t)+'">주제 · '+esc(t)+'</button>'}).join('')+'</div>':'')+(c.products.length?'<div>'+c.products.map(function(p){return '<button type="button" class="chip" data-product="'+esc(p)+'">상품 · '+esc(p)+'</button>'}).join('')+'</div>':'')+(c.points.length?'<ul class="plain">'+c.points.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>':'')+(!c.topics.length&&!c.products.length&&!c.points.length?'<p class="note">태그 없음</p>':'')+'</div>';
  h+='<div class="sec"><h3>언제 · 타임라인 ('+c.events.length+')</h3><ul class="tl">'+c.events.map(function(e){return '<li><span class="dim">'+esc(e.d)+'</span><span class="who"><span class="b '+(e.side==='세스코'?'c':'s')+'">'+esc(e.side)+'</span> '+esc(e.who)+'</span><span class="act">'+esc(e.act)+'</span><span class="nt">'+e.files.map(function(i){var f=c.files[i];return f?'<span class="fl">· '+esc(f.n)+'</span>':''}).join('')+'</span></li>'}).join('')+'</ul></div>';
  var g={};c.files.forEach(function(f,i){(g[f.stg]=g[f.stg]||[]).push(f)});
  h+='<div class="sec files"><h3>파일 ('+c.files.length+')</h3>'+(c.files.length?STG_ORD.filter(function(s){return g[s]}).map(function(s){return '<div class="stg">'+esc(STG[s])+' · '+g[s].length+'</div>'+g[s].slice().sort(function(a,b){return (b.d||'').localeCompare(a.d||'')}).map(function(f){return '<div class="f"><span class="fn">'+esc(f.n)+(f.cur?'<span class="cur">최신본</span>':'')+'</span><span class="dim">'+esc(f.d)+'</span><span class="dim">'+esc(f.by)+'</span></div>'}).join('')}).join(''):'<p class="note">연결된 파일 없음</p>')+'</div>';
  $('#dw-body').innerHTML=h;$('#dw-k').textContent=c.k+' · 건 상세';
  var dw=$('#drawer');dw.classList.add('open');dw.setAttribute('aria-hidden','false');dw.scrollTop=0;setHash(k)}
function closeCase(){var dw=$('#drawer');dw.classList.remove('open');dw.setAttribute('aria-hidden','true');setHash('')}
// render
function render(){S.q=$('#q').value;var L=filtered();renderTabs(L);$('#cnt').textContent=L.length+' / '+C.length+'건';
  var v=S.tab==='cal'?viewCal(L):S.tab==='topic'?viewTopic(L):S.tab==='product'?viewProduct(L):viewList(L);
  $('#main').innerHTML=v;setHash($('#drawer').classList.contains('open')?(parseHash().case||''):'')}
function go(tab,sel){if(tab==='topic')S.topic=sel;if(tab==='product')S.product=sel;S.tab=tab;closeCase();render();window.scrollTo(0,0)}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1400)}
function copy(t){var done=function(){toast('경로를 복사했습니다')};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fallback);else fallback();function fallback(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){prompt('경로',t)}a.remove()}}
document.addEventListener('click',function(e){var el=e.target.closest('[data-copy],[data-topic],[data-product],[data-k],[data-t],[data-sort],[data-ym]');if(!el)return;
  if(el.hasAttribute('data-copy')){e.preventDefault();copy(el.getAttribute('data-copy'));return}
  if(el.hasAttribute('data-t')){go(el.getAttribute('data-t'));return}
  if(el.hasAttribute('data-topic')){e.preventDefault();go('topic',el.getAttribute('data-topic'));return}
  if(el.hasAttribute('data-product')){e.preventDefault();go('product',el.getAttribute('data-product'));return}
  if(el.hasAttribute('data-sort')){var k=el.getAttribute('data-sort');if(S.sort===k)S.dir=-S.dir;else{S.sort=k;S.dir=1}render();return}
  if(el.hasAttribute('data-ym')){S.ym=el.getAttribute('data-ym');render();return}
  if(el.hasAttribute('data-k')){e.preventDefault();openCase(el.getAttribute('data-k'))}});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='ymsel'){S.ym=e.target.value;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCase()});
$('#dw-close').addEventListener('click',closeCase);
var tm;$('#q').addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(render,150)});
buildFilters();
var h0=parseHash();if(h0.tab&&/^(cal|topic|product|list)$/.test(h0.tab))S.tab=h0.tab;if(h0.ym&&/^\d{4}-\d{2}$/.test(h0.ym))S.ym=h0.ym;if(h0.sel){if(S.tab==='topic')S.topic=h0.sel;if(S.tab==='product')S.product=h0.sel}
render();if(h0.case&&byK[h0.case])openCase(h0.case);
})();
</script></body></html>
