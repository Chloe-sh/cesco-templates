.notes .vr{border:1px solid var(--line);border-radius:4px;padding:7px 9px;margin-bottom:6px}
.notes .vr.cur{border-color:var(--blue);background:var(--blue-l)}

body.no-notes .notes{display:none}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .bar,.notes,.pagewrap .cap{display:none!important}

}

function specHTML(sp, preview3, compact){
  let items = sp.items;
  /* 간략형: 항목명 · 값을 한 문단으로. 인증 마크 자리와 누끼 이미지는 두지 않습니다 */
  if(compact){
    const tv = i => i.colors ? i.colors.map(c=>c[0]).join(' · ') : i.v;
    return `<div class="specs-c" data-compact><b class="t">${sp.title.replace(/^•\s*/,'')} 제원</b>${items.map(i=>`<b>${i.k}</b> ${tv(i)}`).join('<i>|</i>')}</div>`;
  }
  if(preview3) items = items.filter(i=>!i.colors).slice(0,3);
  const val = i => i.colors ? i.colors.map(c=>`<span class="chip"><i style="background:${c[1]}"></i>${c[0]}</span>`).join('') : i.v;
  if(items.length<=3){
    return `<div class="specs tbl"><div><p class="stitle">${sp.title}</p>
      <table class="st"><tr>${items.map(i=>`<th>${i.k}</th>`).join('')}</tr><tr>${items.map(i=>`<td>${val(i)}</td>`).join('')}</tr></table></div>
      <div class="ph">${sp.cut||'<b>이미지 · 제품 누끼</b>'}</div></div>`;
  }
  return `<div class="specs list"><div><p class="stitle">${sp.title}</p>
    <dl>${items.map(i=>{const w=i.colors||String(i.v).replace(/<[^>]+>/g,'').length>30;return `<dt>${i.k}</dt><dd${w?' class="w"':''}>${val(i)}</dd>`;}).join('')}</dl></div>
    <div class="ph">${sp.mark||'<b>인증 마크 자리</b>'}</div></div>`;
}

  const h3 = `<h3>${b.title}${b.sub?`<small>${b.sub}</small>`:''}</h3>`;
  const n = (b.items||[]).length;
  if(b.kind==='proof') return `<div class="blk">${h3}<div class="proof" style="grid-template-columns:repeat(${n},1fr)">${b.items.map(i=>`<div class="c"><div class="n">${i.n}</div><div class="l">${i.l}</div></div>`).join('')}</div></div>`;
  if(b.kind==='how') return `<div class="blk">${h3}<div class="how ${b.flow?'flow':''}" style="grid-template-columns:repeat(${n},1fr)">${b.items.map((i,k)=>`<div class="c">${b.flow?`<span class="no">${k+1}</span>`:''}<div class="t">${i.t}</div><div class="d">${i.d}</div></div>`).join('')}</div></div>`;
  if(b.kind==='cause'){ const c=b.cols||['이런 고민','원인','세스코 해법'];
    return `<div class="blk">${h3}<div class="cause"><div class="r h"><div>${c[0]}</div><div>${c[1]}</div><div>${c[2]}</div></div>${b.items.map(i=>`<div class="r"><div class="q">${i.q}</div><div>${i.c}</div><div class="a">${i.a}</div></div>`).join('')}</div></div>`; }
  if(b.kind==='pair') return `<div class="blk">${h3}<div class="pair" style="grid-template-columns:repeat(${n},1fr)">${b.items.map(i=>`<div class="c"><div class="ph">${i.img||'<b>제품 컷</b>'}</div><div><div class="u">${i.u||''}</div><div class="t">${i.t}</div>${i.d?`<div class="d">${i.d}</div>`:''}</div></div>`).join('')}</div></div>`;
  if(b.kind==='pick' && b.items.some(i=>i.s)){ const c=b.cols||['구분','기준','권장'];
    return `<div class="blk">${h3}<div class="pick s3"><div class="r h"><div>${c[0]}</div><div>${c[1]}</div><div>${c[2]}</div></div>${b.items.map(i=>`<div class="r"><div class="sp">${i.s}</div><div>${i.q}</div><div class="a">${i.a}</div></div>`).join('')}</div></div>`; }
  if(b.kind==='pick') return `<div class="blk">${h3}<div class="pick">${b.items.map(i=>`<div class="r"><div>${i.q}</div><div class="a">${i.a}</div></div>`).join('')}</div></div>`;
  if(b.kind==='list') return `<div class="blk">${h3}<ul class="clist" style="grid-template-columns:repeat(${b.cols||2},1fr)">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
  if(b.kind==='point') return `<div class="blk">${h3}<div class="point"><div class="n">${b.n}<small>${b.l||''}</small></div><div class="d">${b.d}</div></div></div>`;
  return '';
}
function blocksHTML(bl){
  let out='', i=0;
  while(i<bl.length){
    if(bl[i].half && bl[i+1] && bl[i+1].half){ out+=`<div class="brow blk">${blockHTML(bl[i])}${blockHTML(bl[i+1])}</div>`; i+=2; }
    else { out+=blockHTML(bl[i]); i++; }
  }
  return out;
}

function ctaHTML(c){
  /* 제품 한 줄 카피 + 고객센터 · 필요한 접점 정보. 훅 · 근거 목록 · 명함 영역은 두지 않습니다 */
  const contact = `<div class="contact"><div class="clabel">${c.label}</div><div class="ctel">${c.tel}</div><div class="curl">${c.url}</div></div>`;
  const qr = c.qr ? `<div class="qr">${c.qr}</div>` : '';
  return `<section class="cta ${c.kind}${c.qr?' hasqr':''}"><p class="cmain">${c.main}</p>${contact}${qr}</section>`;
}

function sheetHTML(p, vi){
  const {hero, cta} = merge(p, vi);
  const f = p.features;
  let h = `<div class="sheet" data-pid="${p.id}" data-vi="${vi}">
  <div class="logo-row"><img class="logo" src="${LOGO}" alt="세스코 CESCO"></div>
  <section class="hero"><div><h1>${hero.h1}</h1><p class="lead">${hero.lead}</p><div class="pname">${hero.name}</div><div class="psub">${hero.sub}</div></div>
    <div class="ph hero-img">${hero.img}</div></section>`;
  const bl = p.blocks||[], at = k => bl.filter(b=>(b.pos||'bottom')===k);
  h += blocksHTML(at('top'));
  if(p.targets) h += `<section class="tgt${p.targets.items.some(x=>x.replace(/<[^>]+>/g,'').length>22)?' two':''}"><div class="tl">${p.targets.title}</div><ul>${p.targets.items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
  h += blocksHTML(at('mid'));
  const fn = f.items.length;
  if(fn<=3) h += `<section class="sec"><h2>${f.title}</h2><div class="fcols" style="grid-template-columns:repeat(${fn},1fr)">${f.items.map(x=>`<div class="fcol"><span class="ftag">${x.tag}</span><div class="ft">${x.t}</div><div class="fd">${x.d}</div>${x.m?`<div class="fm">${x.m}</div>`:''}</div>`).join('')}</div></section>`;
  else if(S.ftall!==null ? S.ftall : f.layout!=='rows'){
    /* A안: 3개 구성처럼 가로로 놓고 세로로 길게. 제목은 데이터의 줄바꿈(<br>)을 그대로 살려 뜻 단위로 끊고,
       근거 줄의 줄바꿈만 풀어 좁은 폭에 맞춰 흐르게 합니다 */
    const nb = t => t.replace(/<br\s*\/?>/g,' ');
    h += `<section class="sec"><h2>${f.title}</h2><div class="fcols tall n${fn}" style="grid-template-columns:repeat(${fn},1fr)">${f.items.map(x=>`<div class="fcol"><span class="ftag">${x.tag}</span><div class="ft">${x.t}</div><div class="fd">${x.d}</div>${x.m?`<div class="fm">${nb(x.m).replace(/ \| /g,'<br>')}</div>`:''}</div>`).join('')}</div></section>`;
  }
  else h += `<section class="sec"><h2>${f.title}</h2><div class="frows">${f.items.map(x=>`<div class="frow"><span class="ftag">${x.tag}</span><div class="ft">${x.t}</div><div class="fd">${x.d}${x.m?`<div class="fm">${x.m}</div>`:''}</div></div>`).join('')}</div></section>`;
  /* 가변 슬롯(특장점 아래 · 가격 위): 제품마다 고른 블록 */
  h += blocksHTML(at('bottom'));
  /* 가격표: 지면 아래쪽 강조 상자 */
  const pr = p.price;
  h += `<section class="price"><h2>${pr.title}<small class="psub2">${pr.sub||''}</small></h2>
    <table class="pt"><tr>${pr.cols.map(x=>`<th>${x}</th>`).join('')}</tr>${pr.rows.map(r=>`<tr>${r.map((x,k)=>`<td class="${pr.cls[k]||''}">${x}</td>`).join('')}</tr>`).join('')}</table>
    ${(pr.notes||[]).map(x=>`<p class="pnotes">※ ${x}</p>`).join('')}</section>`;
  /* 제원표: 환경가전에만 · 가격표 바로 아래 */
  if(p.type==='appliance' && p.specs) h += `<section class="sec" data-specs>${specHTML(p.specs, S.spec3, S.specC||p.specs.compact===true)}</section>`;
  if(p.trust) h += `<div class="trust">${p.trust}</div>`;
  h += `<div class="fn">${p.fn.map(x=>`<p>${x}</p>`).join('')}</div>`;
  h += ctaHTML(cta) + `</div>`;
  return chk(h);
}

function measure(el){
  const fixed = el.clientHeight;               // 지면 높이(297mm)
  const prev = el.style.height; el.style.height='auto';
  const need = el.scrollHeight; el.style.height = prev;
  const over = Math.ceil((need - fixed)/fixed*297 - 0.3);
  // CTA 메인 한 줄 검사
  const cm = el.querySelector('.cmain'); const one = cm ? cm.getBoundingClientRect().height < parseFloat(getComputedStyle(cm).lineHeight)*1.5 && cm.scrollWidth<=cm.clientWidth+1 : true;
  return {over, one};
}

function render(){
  const p = DATA.find(d=>d.id===S.pid);
  const nV = p.variants.length;
  if(S.vi>=nV) S.vi=0;
  const vis = S.side ? [...Array(nV).keys()] : [S.vi];
  const pages = document.getElementById('pages');
  /* 특장점 배치 A·B 나란히: 같은 안을 두 배치로 그립니다 */
  const fcmp = S.fside && p.features.items.length>=4;
  pages.className = 'pages' + ((S.side||fcmp)?' side':'');
  if(fcmp){
    const keep = S.ftall;
    pages.innerHTML = [[true,'A안 가로 카드'],[false,'B안 세로 나열']].map(([ft,cap])=>{ S.ftall=ft; return `<div class="pagewrap"><div class="cap"><b>${cap}</b> · 특장점 ${p.features.items.length}개 <span class="badge"></span></div>${sheetHTML(p,S.vi)}</div>`; }).join('');
    S.ftall = keep;
  } else
  pages.innerHTML = vis.map(vi=>`<div class="pagewrap"><div class="cap"><b>${vi+1}안</b> · ${p.variants[vi].name} <span class="badge" data-b="${vi}"></span></div>${sheetHTML(p,vi)}</div>`).join('');
  // 배지
  let worst = -999, allOne = true;
  pages.querySelectorAll('.sheet').forEach(sh=>{
    /* 제원표를 넣고 지면이 넘치면 간략형(텍스트)으로 자동 전환 */
    { const sp=sh.querySelector('[data-specs]'); if(sp && !sp.querySelector('[data-compact]') && (sh.querySelector('.hero-img').style.minHeight='', sh.style.setProperty('--xg','0mm'), measure(sh).over>0)){ sp.innerHTML=chk(specHTML(p.specs,false,true)); sh.dataset.autoc='1'; } }
    /* 지면이 남으면 블록을 더 넣지 않고 대표 이미지를 키웁니다 (최대 +30mm) */
    { const hi=sh.querySelector('.hero-img'); hi.style.minHeight=''; const fixed=sh.clientHeight; sh.style.height='auto'; const need=sh.scrollHeight; sh.style.height='';
      sh.style.setProperty('--xg','0mm'); let slack=(fixed-need)/fixed*297; if(slack>6){ const g=Math.min(30,slack-3); hi.style.minHeight=(44+g)+'mm'; slack-=g; }
      /* 그래도 남으면 블록 사이 간격을 고르게 벌립니다 (블록당 최대 4mm) */
      if(slack>4){ const n=sh.children.length-1; sh.style.setProperty('--xg', Math.min(4,(slack-2)/n).toFixed(2)+'mm'); } }
    const r = measure(sh); worst = Math.max(worst, r.over); allOne = allOne && r.one;
    const b = sh.closest('.pagewrap').querySelector('.cap .badge');
    b.className = 'badge ' + (r.over>0||!r.one?'over':'ok');
    b.textContent = r.over>0 ? `지면 초과 약 ${r.over}mm` : (r.one?'지면 OK':'CTA 메인 2줄');
  });
  // 상단 바
  const bar = document.getElementById('bar');
  bar.innerHTML = `
    <div class="grp"><b>제품</b>${DATA.map(d=>`<button data-p="${d.id}" class="${d.id===S.pid?'on':''}">${d.label}</button>`).join('')}</div>
    <div class="grp"><b>안</b>${p.variants.map((v,i)=>`<button data-v="${i}" class="${!S.side&&i===S.vi?'on':''}">${i+1}안</button>`).join('')}
      <button data-side class="${S.side?'on':''}">${nV}안 나란히</button></div>
    <div class="grp"><b>특장점 4~5개</b><button data-fa class="${p.features.items.length>=4 && (S.ftall!==null?S.ftall:p.features.layout!=='rows')?'on':''}" ${p.features.items.length<4?'disabled':''}>A안 가로 카드</button><button data-fb class="${p.features.items.length>=4 && !(S.ftall!==null?S.ftall:p.features.layout!=='rows')?'on':''}" ${p.features.items.length<4?'disabled':''}>B안 세로 나열</button><button data-fs class="${S.fside&&p.features.items.length>=4?'on':''}" ${p.features.items.length<4?'disabled':''}>A·B 나란히</button></div>
    <div class="grp"><button data-spec3 class="${S.spec3?'on':''}" ${p.type!=='appliance'?'disabled':''}>제원 3개 이하 미리보기</button>
      <button data-specc class="${S.specC?'on':''}" ${p.type!=='appliance'?'disabled':''}>제원 간략형 미리보기</button>
      <button data-notes>메모 숨기기</button><button data-print>인쇄</button></div>
    <div class="grp"><span class="badge ${worst>0||!allOne?'over':'ok'}">${worst>0?`지면 초과 약 ${worst}mm`:(allOne?'지면 OK':'CTA 메인 2줄')}</span></div>`;
  bar.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.pid=b.dataset.p;S.vi=0;S.side=false;S.spec3=false;S.specC=false;go();});
  bar.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.vi=+b.dataset.v;S.side=false;go();});
  bar.querySelector('[data-fa]').onclick=()=>{S.ftall=true;S.fside=false;render();};
  bar.querySelector('[data-fb]').onclick=()=>{S.ftall=false;S.fside=false;render();};
  bar.querySelector('[data-fs]').onclick=()=>{S.fside=!S.fside;if(S.fside)S.side=false;render();};
  bar.querySelector('[data-side]').onclick=()=>{S.fside=false;S.side=!S.side;go();};
  bar.querySelector('[data-spec3]').onclick=()=>{S.spec3=!S.spec3;S.specC=false;render();};
  bar.querySelector('[data-specc]').onclick=()=>{S.specC=!S.specC;S.spec3=false;render();};
  bar.querySelector('[data-notes]').onclick=()=>document.body.classList.toggle('no-notes');
  bar.querySelector('[data-print]').onclick=()=>window.print();
  // 디자이너 노트
  document.getElementById('notes').innerHTML = chk(`
    <h4>디자이너 노트 · ${p.label}</h4>
    ${p.variants.map((v,i)=>`<div class="vr ${(!S.side&&i===S.vi)?'cur':''}"><b>${i+1}안 · ${v.name}</b><br>${v.why}</div>`).join('')}
    <h4>메모</h4><table>${(p.notes||[]).map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table>
    <h4>공통 메모</h4><table>${COMMON_NOTES.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table>`);
}
function go(){ location.hash = `${S.pid}/${S.vi+1}${S.side?'/side':''}`; render(); }
function fromHash(){
  const [id,v,side] = decodeURIComponent(location.hash.slice(1)).split('/');
  if(DATA.some(d=>d.id===id)){ S.pid=id; S.vi=Math.max(0,(+v||1)-1); S.side=side==='side'; }
}
window.addEventListener('hashchange',()=>{fromHash();render();});
fromHash();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(render); else render();
render();
</script>
</body>
</html>
